name: 페이지 유사도 검사 (5% 문턱)
on:
  workflow_dispatch:
  schedule:
    - cron: '53 19 * * *'   # 매일 오전 4시 53분(한국) — 고친 페이지가 5% 미만이 되면 다음 배포에 풀림
permissions:
  contents: write
  actions: write
jobs:
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: 지금 배포된 사이트 받기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=github-pages&per_page=30" --jq '[.artifacts[]|select(.expired|not)]|sort_by(.created_at)|last|.id')
          gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > a.zip
          unzip -q a.zip && mkdir -p _site && tar -xf artifact.tar -C _site && rm -f a.zip artifact.tar
          find _site -name '*.html' | wc -l
      - run: pip install -q numpy
      - run: python3 build/sim/similarity.py _site sim-out
      - name: data-sim 브랜치에 결과 저장
        run: |
          cd sim-out
          git init -q && git checkout -q -b data-sim
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add sim.json && git commit -qm "similarity $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data-sim
      - name: 새 결과로 다시 배포 (5% 문턱 적용)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo ${{ github.repository }} --ref main
